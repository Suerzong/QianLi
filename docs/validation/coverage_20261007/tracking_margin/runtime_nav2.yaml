amcl:
  ros__parameters:
    base_frame_id: base_footprint
    global_frame_id: map
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0
      z: 0.0
    laser_max_range: 12.0
    laser_min_range: 0.12
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    robot_model_type: nav2_amcl::OmniMotionModel
    scan_topic: /scan
    set_initial_pose: true
    update_min_a: 0.1
    update_min_d: 0.1
    use_sim_time: true
behavior_server:
  ros__parameters:
    backup:
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    cycle_frequency: 10.0
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    enable_stamped_cmd_vel: true
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    global_frame: map
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    local_frame: odom
    max_rotational_vel: 0.6
    min_rotational_vel: 0.1
    robot_base_frame: base_footprint
    rotational_acc_lim: 1.2
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors::Spin
    transform_tolerance: 0.5
    use_sim_time: true
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_server_timeout: 1000
    global_frame: map
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    odom_topic: /odom
    robot_base_frame: base_footprint
    use_sim_time: true
    wait_for_service_timeout: 1000
controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: false
      approach_velocity_scaling_dist: 0.5
      cost_scaling_dist: 0.55
      desired_linear_vel: 0.25
      inflation_cost_scaling_factor: 3.0
      lookahead_dist: 0.35
      lookahead_time: 1.0
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_accel: 1.2
      max_lookahead_dist: 0.5
      min_approach_linear_velocity: 0.04
      min_lookahead_dist: 0.2
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.08
      rotate_to_heading_angular_vel: 0.5
      rotate_to_heading_min_angle: 0.4
      transform_tolerance: 0.5
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: true
    controller_frequency: 10.0
    controller_plugins:
    - FollowPath
    enable_stamped_cmd_vel: true
    failure_tolerance: 0.3
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
    goal_checker_plugins:
    - goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    progress_checker:
      movement_time_allowance: 20.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
    progress_checker_plugins:
    - progress_checker
    use_sim_time: true
