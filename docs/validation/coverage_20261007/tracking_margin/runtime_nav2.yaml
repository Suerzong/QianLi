map_saver:
  ros__parameters:
    map_subscribe_transient_local: true
    save_map_timeout: 10.0
    use_sim_time: true
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
      cost_travel_multiplier: 2.0
      downsample_costmap: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      plugin: nav2_smac_planner::SmacPlanner2D
      smoother:
        do_refinement: false
        max_iterations: 0
      tolerance: 0.05
      use_final_approach_orientation: false
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    use_sim_time: true
smoother_server:
  ros__parameters:
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
    use_sim_time: true
