amcl:
  ros__parameters:
    base_frame_id: base_footprint
    global_frame_id: map
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0
      z: 0.0
    laser_max_range: 12.0
    laser_min_range: 0.12
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    robot_model_type: nav2_amcl::OmniMotionModel
    scan_topic: /scan
    set_initial_pose: true
    update_min_a: 0.1
    update_min_d: 0.1
    use_sim_time: true
behavior_server:
  ros__parameters:
    backup:
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    cycle_frequency: 10.0
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    enable_stamped_cmd_vel: true
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    global_frame: map
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    local_frame: odom
    max_rotational_vel: 0.6
    min_rotational_vel: 0.1
    robot_base_frame: base_footprint
    rotational_acc_lim: 1.2
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors::Spin
    transform_tolerance: 0.5
    use_sim_time: true
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_server_timeout: 1000
    global_frame: map
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    odom_topic: /odom
    robot_base_frame: base_footprint
    use_sim_time: true
    wait_for_service_timeout: 1000
controller_server:
  ros__parameters:
    FollowPath:
      GoalDist.scale: 16.0
      ObstacleFootprint.scale: 0.02
      PathDist.scale: 24.0
      RotateToGoal.lookahead_time: -1.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      acc_lim_theta: 1.2
      acc_lim_x: 0.5
      acc_lim_y: 0.5
      angular_granularity: 0.025
      critics:
      - Oscillation
      - ObstacleFootprint
      - PathDist
      - GoalDist
      - RotateToGoal
      decel_lim_theta: -1.2
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      linear_granularity: 0.05
      max_speed_xy: 0.3
      max_vel_theta: 0.6
      max_vel_x: 0.25
      max_vel_y: 0.25
      min_speed_theta: 0.0
      min_speed_xy: 0.0
      min_vel_x: -0.25
      min_vel_y: -0.25
      plugin: dwb_core::DWBLocalPlanner
      short_circuit_trajectory_evaluation: true
      sim_time: 1.5
      stateful: true
      trans_stopped_velocity: 0.02
      transform_tolerance: 0.5
      vtheta_samples: 15
      vx_samples: 9
      vy_samples: 9
      xy_goal_tolerance: 0.15
    controller_frequency: 10.0
    controller_plugins:
    - FollowPath
    enable_stamped_cmd_vel: true
    failure_tolerance: 0.3
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
    goal_checker_plugins:
    - goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    progress_checker:
      movement_time_allowance: 20.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
    progress_checker_plugins:
    - progress_checker
    use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[0.5152568550494153, 0.0], [0.4760352623662897, 0.1971802618399518],
        [0.3643416162582956, 0.36434161625829553], [0.19718026183995183, 0.4760352623662897],
        [3.155038291374991e-17, 0.5152568550494153], [-0.19718026183995177, 0.4760352623662897],
        [-0.36434161625829553, 0.3643416162582956], [-0.4760352623662897, 0.19718026183995185],
        [-0.5152568550494153, 6.310076582749982e-17], [-0.47603526236628974, -0.19718026183995174],
        [-0.36434161625829564, -0.36434161625829553], [-0.19718026183995208, -0.47603526236628957],
        [-9.465114874124973e-17, -0.5152568550494153], [0.1971802618399519, -0.4760352623662896],
        [0.3643416162582955, -0.36434161625829564], [0.47603526236628957, -0.1971802618399521]]'
      footprint_padding: 0.0
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 3.0
        inflate_around_unknown: true
        inflation_radius: 0.6
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        combination_method: 2
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          obstacle_max_range: 8.0
          obstacle_min_range: 0.12
          raytrace_max_range: 12.0
          raytrace_min_range: 0.12
          topic: /scan
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_footprint
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      transform_tolerance: 0.5
      update_frequency: 2.0
      use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[0.5152568550494153, 0.0], [0.4760352623662897, 0.1971802618399518],
        [0.3643416162582956, 0.36434161625829553], [0.19718026183995183, 0.4760352623662897],
        [3.155038291374991e-17, 0.5152568550494153], [-0.19718026183995177, 0.4760352623662897],
        [-0.36434161625829553, 0.3643416162582956], [-0.4760352623662897, 0.19718026183995185],
        [-0.5152568550494153, 6.310076582749982e-17], [-0.47603526236628974, -0.19718026183995174],
        [-0.36434161625829564, -0.36434161625829553], [-0.19718026183995208, -0.47603526236628957],
        [-9.465114874124973e-17, -0.5152568550494153], [0.1971802618399519, -0.4760352623662896],
        [0.3643416162582955, -0.36434161625829564], [0.47603526236628957, -0.1971802618399521]]'
      footprint_padding: 0.0
      global_frame: odom
      height: 3
      inflation_layer:
        cost_scaling_factor: 3.0
        inflate_around_unknown: true
        inflation_radius: 0.6
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        combination_method: 2
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.12
          raytrace_max_range: 12.0
          raytrace_min_range: 0.12
          topic: /scan
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_footprint
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      transform_tolerance: 0.5
      update_frequency: 5.0
      use_sim_time: true
      width: 3
map_saver:
  ros__parameters:
    map_subscribe_transient_local: true
    save_map_timeout: 10.0
    use_sim_time: true
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.15
      use_astar: true
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    use_sim_time: true
smoother_server:
  ros__parameters:
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
    use_sim_time: true
